identity:
  author: "podshalocef"
  name: "pdfrender"
  label:
    en_US: "pdfrender"
  description:
    en_US: "HTML and CSS to PDF API and MCP server. WeasyPrint with page headers, footers and page numbers, no headless browser. Hosted in Germany."
  icon: "icon.svg"
  tags:
    - "productivity"
    - "utilities"
credentials_for_provider:
  x_api_key:
    type: "secret-input"
    required: false
    label:
      en_US: "pdfrender API key (optional)"
    placeholder:
      en_US: "Leave empty to use the free daily allowance"
    help:
      en_US: "Get a free pdfrender API key"
    url: "https://pdfrender.dev/go/dify?to=/app/api-keys"
tools:
  - "tools/get_me.yaml"
  - "tools/render_html_to_pdf.yaml"
extra:
  python:
    source: "provider/pdfrender.py"
